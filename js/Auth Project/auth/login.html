<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black text-white h-screen w-screen">
    <main class="h-screen w-screen flex justify-center items-center">
        <form id="loginForm" action="" class="border-2 rounded-2xl bg-gray-500 w-[500px] py-3 pb-5">
            <div class="pb-5">
                <h1 class="text-center font-bold text-5xl pt-4 text-amber-300">Login Form</h1>
            </div>
            <div class="flex flex-col  gap-2 justify-center items-left px-5 pt-5 ">
                <label class="text-3xl pl-2" for="username">UserName</label>
                <input class="text-2xl px-5 outline-none border h-15 w-full rounded-3xl" type="text" id="username"
                    name="username">
            </div>
            <div class="flex flex-col  gap-2 justify-center items-left px-5 pt-5 ">
                <label class="text-3xl pl-2" for="password">Your Password</label>
                <input class="text-2xl px-5 outline-none border h-15 w-full rounded-3xl" type="password" id="password"
                    name="password">
                <a class="pt-5 pl-2 pb-3 text-[1.2rem] hover:text-gray-200 " href="register.html">Don't Have An Account?</a>
            </div>
            <div class="flex flex-col gap-2 justify-center items-left px-5 pt-2 ">
                <input class="bg-sky-500 hover:bg-sky-700 p-4 text-2xl rounded-3xl" type="submit" value="Login">
            </div>

        </form>
    </main>
    <script src="auth.js"></script>
</body>

</html>
